[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "codebase-rag-mcp"
version = "0.1.0"
description = "Codebase RAG MCP server: ingest, index, retrieve, and reason over source code via the Model Context Protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "codebase-rag-mcp contributors" },
]
keywords = ["rag", "code-search", "mcp", "codebase", "retrieval", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "langchain-huggingface>=0.1",
    "langchain-community>=0.3",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
codebase-rag = "codebase_rag_mcp.cli.main:main"

[project.urls]
Homepage = "https://github.com/example/codebase-rag-mcp"
Issues = "https://github.com/example/codebase-rag-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_rag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_language_pack.*",
    "faiss.*",
    "rank_bm25.*",
    "sentence_transformers.*",
    "langchain_huggingface.*",
    "langchain_community.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/codebase_rag_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
